cafe24:
  client-id: ${CAFE24_CLIENT_ID}
  client-secret: ${CAFE24_CLIENT_SECRET}
  mall-id: ${CAFE24_MALL_ID}
  redirect-uri: ${CAFE24_REDIRECT_URI}
  webhook:
    api-key: ${CAFE24_WEBHOOK_API_KEY}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

    show-sql: true

server:
  port: 8080