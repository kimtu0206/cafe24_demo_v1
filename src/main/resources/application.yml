cafe24:
  client-id: ${CAFE24_CLIENT_ID}
  client-secret: ${CAFE24_CLIENT_SECRET}
  mall-id: ${CAFE24_MALL_ID}
  redirect-uri: ${CAFE24_REDIRECT_URI}
  scope: >-
    mall.read_application,mall.write_application,mall.read_category,mall.read_product,mall.write_product,mall.read_collection,mall.read_supply,mall.read_order,mall.read_customer,mall.read_promotion,mall.read_shipping,mall.write_shipping,mall.write_customer,mall.read_personal,mall.write_promotion
  state: cafe24-demo-state
  api-version: ${CAFE24_API_VERSION}
  webhook:
    api-key: ${CAFE24_WEBHOOK_API_KEY:}

worker:
  order-webhook:
    fixed-delay-ms: 60000
    batch-size: 50
    max-retry-count: 5

sync:
  order:
    fixed-rate-ms: 86400000
    lookback-hours: 48
  product:
    cron: "0 0 10 * * *"
  carrier:
    cron: "0 30 16 * * *"

spring:
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080